<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07130e">
  <title>Browndy Predicts - Admin</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 20px;
      background: #07130e;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }
    main {
      width: 100%;
      max-width: 650px;
      margin: 30px auto;
    }
    h1 {
      color: #55e39a;
      margin-bottom: 5px;
    }
    h2 {
      margin-top: 5px;
    }
    input,
    button {
      width: 100%;
      padding: 14px;
      margin: 7px 0;
      border-radius: 8px;
      font-size: 16px;
    }
    input {
      background: #10251a;
      color: #ffffff;
      border: 1px solid #456253;
    }
    button {
      background: #35c879;
      color: #06150d;
      border: 0;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    button.reject {
      background: #d95353;
      color: #ffffff;
    }
    .card {
      background: #10251a;
      border: 1px solid #315640;
      border-radius: 12px;
      padding: 16px;
      margin: 14px 0;
      overflow-wrap: anywhere;
    }
    .actions {
      display: flex;
      gap: 10px;
    }
    .actions button {
      flex: 1;
    }
    #message {
      margin: 14px 0;
      color: #ffd477;
      overflow-wrap: anywhere;
    }
    .muted {
      color: #b5c8bc;
    }
    label {
      display: block;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Browndy Predicts</h1>
    <h2>Admin Dashboard</h2>
<p class="muted">
  Review and process pending payment requests.
</p>
<label for="secret">Admin secret</label>
<input
  id="secret"
  type="password"
  placeholder="Enter admin secret"
  autocomplete="off"
>
<button id="load" type="button">
  Load pending payments
</button>
<button id="refresh" type="button">
  Refresh requests
</button>
<p id="message" role="status" aria-live="polite"></p>
<section id="payments"></section>
  </main>
  <script>
    const secretInput = document.getElementById("secret");
    const message = document.getElementById("message");
    const paymentsBox = document.getElementById("payments");
    const loadButton = document.getElementById("load");
    const refreshButton = document.getElementById("refresh");
    function showMessage(text) {
      message.textContent = text;
    }
    async function apiRequest(method, body) {
      const secret = secretInput.value.trim();
      if (!secret) {
        throw new Error("Enter your admin secret first.");
      }
      const options = {
        method: method,
        headers: {
          "Authorization": "Bearer " + secret
        }
      };
      if (body) {
        options.headers["Content-Type"] = "application/json";
        options.body = JSON.stringify(body);
      }
      const response = await fetch("/api/admin", options);
      let data;
      try {
        data = await response.json();
      } catch {
        throw new Error("The server returned an invalid response.");
      }
      if (!response.ok) {
        throw new Error(data.error || "Request failed.");
      }
      return data;
    }
    function makeText(label, value) {
      const p = document.createElement("p");
      const strong = document.createElement("strong");
      strong.textContent = label + ": ";
      p.append(
        strong,
        document.createTextNode(
          value === null || value === undefined || value === ""
            ? "—"
            : String(value)
        )
      );
      return p;
    }
    async function loadPayments() {
      paymentsBox.replaceChildren();
      showMessage("Loading payment requests...");
      loadButton.disabled = true;
      refreshButton.disabled = true;
      try {
        const data = await apiRequest("GET");
        if (!Array.isArray(data.payments)) {
          throw new Error("Unexpected payment list from the server.");
        }
        if (data.payments.length === 0) {
          showMessage("There are no pending payment requests.");
          return;
        }
        showMessage(
          data.payments.length + " pending request(s) found."
        );
        data.payments.forEach(payment => {
          const card = document.createElement("article");
          card.className = "card";
          card.append(
            makeText("Customer", payment.customer_name),
            makeText("Phone", payment.phone_number),
            makeText("Transaction ID", payment.transaction_id),
            makeText("Status", payment.status)
          );
          const actions = document.createElement("div");
          actions.className = "actions";
          const approve = document.createElement("button");
          approve.textContent = "Approve";
          const reject = document.createElement("button");
          reject.textContent = "Reject";
          reject.className = "reject";
          approve.addEventListener("click", () => {
            processPayment(payment.transaction_id, "approve");
          });
          reject.addEventListener("click", () => {
            processPayment(payment.transaction_id, "reject");
          });
          actions.append(approve, reject);
          card.append(actions);
          paymentsBox.append(card);
        });
      } catch (error) {
        showMessage(error.message);
      } finally {
        loadButton.disabled = false;
        refreshButton.disabled = false;
      }
    }
    async function processPayment(transactionId, action) {
      const confirmed = confirm(
        action === "approve"
          ? "Have you independently confirmed that this MTN payment was received? Approve this payment?"
          : "Are you sure you want to reject this payment request?"
      );
      if (!confirmed) {
        return;
      }
      showMessage("Processing payment...");
      loadButton.disabled = true;
      refreshButton.disabled = true;
      try {
        const data = await apiRequest("POST", {
          transaction_id: transactionId,
          action: action
        });
        if (action === "approve") {
          showMessage(
            "Payment approved. Premium expiry: " +
            (data.premium_until || "Updated")
          );
        } else {
          showMessage("Payment rejected.");
        }
        await loadPayments();
      } catch (error) {
        showMessage(error.message);
      } finally {
        loadButton.disabled = false;
        refreshButton.disabled = false;
      }
    }
    loadButton.addEventListener("click", loadPayments);
    refreshButton.addEventListener("click", loadPayments);
  </script>
</body>
</html>
